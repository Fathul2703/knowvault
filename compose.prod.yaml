# Production stack: Caddy terminates TLS; the database, API, worker and web app are reachable
# only on the internal network.
#
#   cp .env.prod.example .env.prod   # then fill it in
#   docker compose -f compose.prod.yaml --env-file .env.prod up -d --build
#
# See README.md, "Production".
name: knowvault-prod

x-api-environment: &api-environment
  ENVIRONMENT: ${ENVIRONMENT:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env.prod}:${POSTGRES_PASSWORD:?set in .env.prod}@db:5432/${POSTGRES_DB:?set in .env.prod}
  APP_ORIGIN: https://${DOMAIN:?set in .env.prod}
  SESSION_COOKIE_SECURE: "true"
  STORAGE_DIR: /data/uploads
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-bge-m3}
  EMBEDDING_CACHE_DIR: /data/models
  LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
  LLM_MODEL: ${LLM_MODEL:-claude-sonnet-5-5}
  LLM_FAST_MODEL: ${LLM_FAST_MODEL:-claude-haiku-4-5-20251001}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  CHAT_DAILY_TOKEN_LIMIT: ${CHAT_DAILY_TOKEN_LIMIT:-200000}
  # Only Caddy (fixed address below) may tell the API who the client is.
  TRUSTED_PROXIES: 172.30.0.10
  # The containers' file systems are read-only; libraries that cache in $HOME use /tmp.
  HOME: /tmp

x-hardened: &hardened
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [internal]

  migrate:
    build:
      context: ./apps/api
      target: prod
    image: knowvault-api:prod
    command: ["alembic", "upgrade", "head"]
    environment: *api-environment
    <<: *hardened
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  api:
    # Built by the migrate service.
    image: knowvault-api:prod
    pull_policy: never
    environment: *api-environment
    <<: *hardened
    volumes:
      - uploads:/data/uploads
      - models:/data/models
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [internal]

  worker:
    image: knowvault-api:prod
    pull_policy: never
    command: ["knowvault", "worker"]
    environment: *api-environment
    <<: *hardened
    volumes:
      - uploads:/data/uploads
      - models:/data/models
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [internal]

  web:
    build:
      context: ./apps/web
      target: prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped
    networks:
      internal:
        ipv4_address: 172.30.0.10

networks:
  internal:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  pgdata:
  uploads:
  models:
  caddy_data:
  caddy_config:
