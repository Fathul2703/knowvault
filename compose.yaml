# Development stack. Usage: `cp .env.example .env && docker compose up --build`
name: knowvault

x-api-environment: &api-environment
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}
  TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}_test
  APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  # Uploaded files, on a volume shared by the api and the worker.
  STORAGE_DIR: /data/uploads
  # bge-m3 (int8, ~570 MB) is downloaded on first use into a volume shared by api and worker.
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-bge-m3}
  EMBEDDING_CACHE_DIR: /data/models

services:
  db:
    # pgvector is needed from Phase 3; using the image now keeps environments identical.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./apps/api
      target: dev
    command: ["alembic", "upgrade", "head"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./apps/api
      target: dev
    environment: *api-environment
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./apps/api:/app
      - uploads:/data/uploads
      - models:/data/models
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: ./apps/api
      target: dev
    # Processes uploaded documents and notes. Restart it to pick up code changes.
    command: ["knowvault", "worker"]
    environment: *api-environment
    volumes:
      - ./apps/api:/app
      - uploads:/data/uploads
      - models:/data/models
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      target: dev
    environment:
      API_INTERNAL_URL: http://api:8000
      # File watching over bind mounts is unreliable on some hosts.
      WATCHPACK_POLLING: "true"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  models:
