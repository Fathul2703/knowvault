[project]
name = "knowvault"
version = "0.1.0"
description = "KnowVault API: personal knowledge management with grounded AI."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "asyncpg>=0.30",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "pydantic-settings>=2.4",
    "pypdf>=5",
    "python-docx>=1.1",
    "python-multipart>=0.0.12",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
knowvault = "knowvault.cli:main"

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PT", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S311", "ASYNC240"]
"migrations/**" = ["N999"]

[tool.mypy]
strict = true
python_version = "3.13"
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.importlinter]
root_package = "knowvault"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core does not depend on feature modules"
type = "forbidden"
source_modules = ["knowvault.core"]
forbidden_modules = ["knowvault.modules"]

[[tool.importlinter.contracts]]
name = "Feature modules do not depend on application entry points"
type = "forbidden"
source_modules = ["knowvault.modules"]
forbidden_modules = ["knowvault.main", "knowvault.cli"]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.30",
    "httpx>=0.27",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[[tool.importlinter.contracts]]
name = "Feature modules use ports, never adapters (wired only in main.py / worker.py)"
type = "forbidden"
source_modules = ["knowvault.core", "knowvault.modules"]
forbidden_modules = ["knowvault.adapters", "knowvault.worker"]

[[tool.importlinter.contracts]]
name = "Ingestion layers: api -> infrastructure -> application -> domain"
type = "layers"
containers = ["knowvault.modules.ingestion"]
layers = ["api", "infrastructure", "application", "domain"]

[[tool.importlinter.contracts]]
name = "Ingestion domain is pure (no framework or database imports)"
type = "forbidden"
source_modules = ["knowvault.modules.ingestion.domain"]
forbidden_modules = ["sqlalchemy", "fastapi", "pydantic", "knowvault.core", "knowvault.modules.library"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Library does not depend on ingestion (ingestion uses library.processing)"
type = "forbidden"
source_modules = ["knowvault.modules.library"]
forbidden_modules = ["knowvault.modules.ingestion"]
