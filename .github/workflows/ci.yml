name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: knowvault
          POSTGRES_PASSWORD: knowvault
          POSTGRES_DB: knowvault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowvault"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://knowvault:knowvault@localhost:5432/knowvault_test
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tags after v7, so pin the release commit.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: apps/api
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run mypy
      - run: uv run pytest
      - name: OpenAPI schema is committed and up to date
        run: |
          uv run knowvault export-openapi > openapi.json
          git diff --exit-code openapi.json

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: API types match the committed OpenAPI schema
        run: |
          npm run generate:api
          git diff --exit-code src/lib/api/schema.ts
      - run: npm run build

  audit:
    name: Dependency audit
    # Runtime dependencies only: known vulnerabilities in what runs in production fail the
    # build. Development tools are kept current by Dependabot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: apps/api
      - name: Python packages (locked, without development tools)
        working-directory: apps/api
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt \
            --output-file "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --requirement "$RUNNER_TEMP/requirements.txt" \
            --disable-pip --no-deps --progress-spinner off
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm packages (without development tools)
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
